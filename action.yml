name: setup-icarus
description: Install a prebuilt Icarus Verilog
branding:
  color: green
  icon: download
inputs:
  version:
    description: "Icarus release to install (for example 2026.11.04). Defaults to the latest package release."
    required: false
    default: latest
  ubuntu-version:
    description: "Ubuntu asset to use (`auto` = match the runner VERSION_ID, usually 26.04 on ubuntu-latest)."
    required: false
    default: auto
runs:
  using: composite
  steps:
    - name: Install Icarus
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        . /etc/os-release
        if [ "${ID:-}" != "ubuntu" ]; then
          echo "setup-icarus supports Ubuntu only (this runner is ${ID:-unknown})" >&2
          exit 1
        fi
        ubuntu="${{ inputs.ubuntu-version }}"
        if [ "$ubuntu" = "auto" ]; then
          ubuntu="${VERSION_ID:-}"
        fi
        case "$ubuntu" in
          24.04|26.04) ;;
          *)
            echo "setup-icarus supports ubuntu-24.04 and ubuntu-26.04 (requested ${ubuntu})" >&2
            exit 1
            ;;
        esac
        version="${{ inputs.version }}"
        asset="icarus-ubuntu-${ubuntu}.tar.gz"
        if [ "$version" = "latest" ]; then
          url="https://github.com/daxzio/icarus-package/releases/latest/download/${asset}"
        else
          url="https://github.com/daxzio/icarus-package/releases/download/${version}/${asset}"
        fi
        dest="${RUNNER_TEMP}/icarus"
        rm -rf "$dest"
        mkdir -p "$dest"
        curl -fsSL "$url" | tar -xz -C "$dest"
        if [ ! -x "$dest/bin/iverilog" ] || [ ! -x "$dest/bin/vvp" ]; then
          echo "archive from ${url} did not contain bin/iverilog and bin/vvp" >&2
          exit 1
        fi
        echo "$dest/bin" >> "$GITHUB_PATH"