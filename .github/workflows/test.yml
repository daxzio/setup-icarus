name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: latest
            expect: "2026.11.04-dirty"
          - version: v13_0
            expect: "Icarus Verilog version 13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Icarus
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Report version
        run: |
          iverilog -V
          vvp -V
          iverilog -V | grep -F "${{ matrix.expect }}"

      - name: Compile and run
        run: |
          cat > t.v << 'EOF'
          module t;
            initial begin
              $display("icarus ok");
              $finish;
            end
          endmodule
          EOF
          iverilog -o t.vvp t.v
          vvp t.vvp | grep -F "icarus ok"
