name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Icarus
        uses: ./
        with:
          version: latest

      - name: Report version
        run: |
          iverilog -V
          vvp -V
          iverilog -V | grep -F "2026.11.04-dirty"

      - name: Compile and run
        run: |
          cat > t.v << 'EOF'
          module t;
            initial begin
              $display("icarus ok");
              $finish;
            end
          endmodule
          EOF
          iverilog -o t.vvp t.v
          vvp t.vvp | grep -F "icarus ok"